<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Pet Access</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/footer.css">
</head>
<body class="bg-light">
    <div id="navCont"></div>

    <div class="container mt-5 mb-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body p-4">
                <h2 class="card-title mb-2" id="page-title">Manage Pet Access</h2>
                <p class="text-muted mb-4">Control who can view and edit records for <span id="pet-name-display" class="fw-bold">your pet</span>.</p>
                
                <div id="error-message" class="alert alert-danger d-none fw-bold"></div>
                <div id="access-alert" class="alert d-none" role="alert"></div>

                <form id="share-access-form" class="mb-4 pb-4 border-bottom">
                    <input type="hidden" id="pet_id" name="pet_id">
                    <label for="share-email" class="form-label fw-bold">Grant Access to User</label>
                    <div class="input-group">
                        <input type="email" id="share-email" class="form-control" placeholder="enter user's email address" required>
                        <button type="submit" class="btn btn-success" id="grant-btn">Grant Access</button>
                    </div>
                </form>

                <div>
                    <h5 class="fw-bold mb-3">Users with Access</h5>
                    <ul class="list-group" id="access-list">
                        <li class="list-group-item text-muted text-center py-3" id="empty-list-msg">
                            Loading access lists...
                        </li>
                    </ul>
                </div>

                <div class="d-flex justify-content-end mt-4">
                    <button type="button" class="btn btn-secondary" onclick="window.history.back()">Back</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/include/navbar.js"></script>
    <script src="/include/footer.js"></script>
    <script type="module" src="/js/pet/manageAccess.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
