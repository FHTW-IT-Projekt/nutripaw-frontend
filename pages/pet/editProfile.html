<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Pet Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/pet/editPetProfile.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/userprofile.css">
</head>
<body class="bg-light">
    <div id="navCont"></div>

    <div class="container mt-5 mb-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body p-4">
                <h2 class="card-title mb-4 pb-2 border-bottom" id="page-title">Edit Pet Profile</h2>
                
                <div id="error-message" class="alert alert-danger d-none fw-bold">
                    You do not have permission to edit this profile.
                </div>
                
                <div id="image-upload-alert" class="alert d-none" role="alert"></div>

                <form id="pet-form">
                    <input type="hidden" id="pet_id" name="pet_id">

                    <!-- Pet photo upload -->
                    <div class="mb-4 text-center">
                        <div class="avatar-preview-circle mx-auto mb-2" style="width:100px;height:100px;">
                            <img id="pet-avatar-preview-img" alt="Pet photo" class="d-none" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
                            <span id="pet-avatar-preview-icon" style="font-size:2rem;">🐾</span>
                        </div>
                        <label for="edit-pet-image" class="btn btn-outline-secondary btn-sm">Change Photo</label>
                        <input type="file" id="edit-pet-image" accept=".jpg,.jpeg,.png" class="d-none">
                        <p class="form-text mb-0">JPG, JPEG, PNG · max 5 MB</p>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">Pet Name:</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="species" class="form-label fw-bold">Species:</label>
                        <input type="text" id="species" name="species" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="breed" class="form-label fw-bold">Race/Breed:</label>
                        <input type="text" id="breed" name="breed" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="age" class="form-label fw-bold">Age (Years):</label>
                        <input type="number" id="age" name="age" step="0.1" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="color" class="form-label fw-bold">Colour:</label>
                        <input type="text" id="color" name="color" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="gender" class="form-label fw-bold">Gender:</label>
                        <select id="gender" name="gender" class="form-select">
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Unknown">Unknown</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="weight" class="form-label fw-bold">Weight (kg):</label>
                        <input type="number" id="weight" name="weight" step="0.01" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="diagnosis" class="form-label fw-bold">Diagnosis:</label>
                        <input type="text" id="diagnosis" name="diagnosis" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="medication" class="form-label fw-bold">Medication:</label>
                        <input type="text" id="medication" name="medication" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="behaviour" class="form-label fw-bold">Behaviour / Special Features:</label>
                        <textarea id="behaviour" name="behaviour" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="dietaryRestrictions" class="form-label fw-bold">Dietary Restrictions:</label>
                        <textarea id="dietaryRestrictions" name="dietaryRestrictions" class="form-control" rows="2"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="medicalNotes" class="form-label fw-bold">Medical Notes:</label>
                        <textarea id="medicalNotes" name="medicalNotes" class="form-control" rows="3"></textarea>
                    </div>

                    <!-- Neue Felder für die detaillierte Medikamentenplanung -->
                    <div class="card mt-4">
                        <div class="card-header bg-light">
                            <h5 class="mb-0">Plan new medication</h5>
                        </div>
                        <div class="card-body">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Medication name</label>
                                    <input type="text" class="form-control" name="medication_name" placeholder="e.g. Traumeel">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Category/Type</label>
                                    <input type="text" class="form-control" name="medication_type" placeholder="e.g. Painkiller">
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label">Dosage</label>
                                    <input type="text" class="form-control" name="dosage" placeholder="e.g. 1 pill, 5ml">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Start-Date</label>
                                    <input type="date" class="form-control" name="start_date">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">End-Date</label>
                                    <input type="date" class="form-control" name="end_date">
                                </div>
                                
                                <!-- Rhythmus festlegen -->
                                <div class="col-md-12">
                                    <label class="form-label fw-bold">Wiederholung</label>
                                    <select class="form-select" name="medication_interval" id="medication-interval" onchange="toggleWeeklyOptions()">
                                        <option value="daily">Dayly</option>
                                        <option value="weekly">Weekly</option>
                                    </select>
                                </div>

                                <!--  Wochentage (wird standardmäßig via CSS ausgeblendet, falls täglich) -->
                                <div class="col-md-12 d-none" id="weekly-days-container">
                                    <label class="form-label d-block fw-bold">On what days?</label>
                                    <div class="d-flex gap-3 flex-wrap">
                                        <label><input type="checkbox" class="week-day-checkbox" value="1"> MO</label>
                                        <label><input type="checkbox" class="week-day-checkbox" value="2"> TU</label>
                                        <label><input type="checkbox" class="week-day-checkbox" value="3"> WE</label>
                                        <label><input type="checkbox" class="week-day-checkbox" value="4"> TH</label>
                                        <label><input type="checkbox" class="week-day-checkbox" value="5"> FR</label>
                                        <label><input type="checkbox" class="week-day-checkbox" value="6"> SA</label>
                                        <label><input type="checkbox" class="week-day-checkbox" value="0"> SU</label>
                                    </div>
                                </div>
                                
                                <!-- Dynamische Uhrzeiten-Liste -->
                                <div class="col-md-12">
                                    <label class="form-label fw-bold">Time schedule for medication</label>
                                    <div id="dynamic-times-list" class="d-flex flex-column gap-2 mb-2">
                                        <!-- Hier landen die Uhrzeiten-Zeilen -->
                                        <div class="d-flex gap-2 time-row">
                                            <input type="time" class="form-control med-time-input" style="max-width: 150px;" value="08:00" required>
                                            <button type="button" class="btn btn-outline-danger btn-sm" onclick="this.parentElement.remove()">X</button>
                                        </div>
                                    </div>
                                    <button type="button" class="btn btn-secondary btn-sm" id="add-time-btn">+ add time</button>
                                </div>                                

                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" class="btn btn-secondary" onclick="window.history.back()">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-save" id="profile-save-btn">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="/include/navbar.js"></script>
    <script src="/include/footer.js"></script>
    <script type="module" src="/js/pet/editProfile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
