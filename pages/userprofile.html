<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriPaw - My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/user.css">
    <link rel="stylesheet" href="/css/userprofile.css">
</head>
<body>
    <div id="navCont"></div>

    <main class="container my-5">

        <!-- User Info Card -->
        <div class="profile-card rounded-4 shadow-sm p-4 mb-5">
            <div class="d-flex align-items-center justify-content-between gap-4 flex-wrap">
                <div class="d-flex align-items-center gap-4">
                    <div class="user-avatar">
                        <span id="user-initials">?</span>
                    </div>
                    <div>
                        <h2 class="mb-1 fw-bold" id="user-name">-</h2>
                        <p class="text-muted mb-1" id="user-email">-</p>
                        <span id="user-role-badge" class="badge role-badge d-none"></span>
                    </div>
                </div>
                <button class="btn btn-tan btn-sm" id="edit-profile-btn">Edit Profile</button>
            </div>
            <div id="profile-alert" class="alert d-none mt-3" role="alert"></div>
        </div>

        <!-- My Pets Section -->
        <div class="d-flex justify-content-between align-items-center pets-header">
            <h2 class="section-title mb-0">My Pets</h2>
            <button class="btn btn-tan" data-bs-toggle="modal" data-bs-target="#addPetModal">
                + Add Pet
            </button>
        </div>

        <div id="my-pets-container">
            <p class="text-muted text-center py-3">Loading pets...</p>
        </div>

    </main>

    <!-- Add Pet Modal -->
    <div class="modal fade" id="addPetModal" tabindex="-1" aria-labelledby="addPetModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addPetModalLabel">Add New Pet</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="add-pet-form" novalidate>
                        <div class="mb-3">
                            <label for="pet-name" class="form-label">Pet Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="pet-name" placeholder="e.g. Nao" required>
                        </div>
                        <div class="mb-3">
                            <label for="pet-species" class="form-label">Species <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="pet-species" placeholder="e.g. Cat, Dog, Rabbit" required>
                        </div>
                        <div class="mb-3">
                            <label for="pet-age" class="form-label">Age</label>
                            <input type="text" class="form-control" id="pet-age" placeholder="e.g. 3 yrs. old">
                        </div>
                        <div class="mb-3">
                            <label for="pet-weight" class="form-label">Weight</label>
                            <input type="text" class="form-control" id="pet-weight" placeholder="e.g. 4.5 kg">
                        </div>
                    </form>
                    <div id="add-pet-alert" class="alert d-none" role="alert"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-tan" id="add-pet-submit">Add Pet</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editProfileModalLabel">Edit Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-profile-form" novalidate>
                        <div class="mb-3">
                            <label for="edit-firstname" class="form-label">First Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="edit-firstname" required>
                        </div>
                        <div class="mb-3">
                            <label for="edit-lastname" class="form-label">Last Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="edit-lastname" required>
                        </div>
                        <div class="mb-3">
                            <label for="edit-email" class="form-label">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="edit-email" required>
                        </div>
                        <div class="mb-3">
                            <label for="edit-role" class="form-label">Role</label>
                            <select class="form-select" id="edit-role">
                                <option value="owner">Owner</option>
                                <option value="sitter">Sitter</option>
                            </select>
                        </div>
                    </form>
                    <div id="edit-profile-alert" class="alert d-none" role="alert"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-tan" id="edit-profile-submit">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <div id="footerCont"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/include/navbar.js"></script>
    <script src="/include/footer.js"></script>
    <script type="module" src="/js/userprofile.js"></script>
</body>
</html>
